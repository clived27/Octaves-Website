<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Octaves, VNIT Nagpur</title>
  <meta name="description" content="A visual chronicle of Octaves — behind-the-scenes rehearsals, stage setups, candid moments, and the faces behind the music." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #08080e;
      min-height: 100vh;
    }

    /* ── Top navigation bar ── */
    .gallery-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem clamp(1.5rem, 5vw, 3rem);
      background: rgba(8, 8, 14, 0);
      transition: background 0.4s, border-color 0.4s;
      border-bottom: 1px solid transparent;
    }

    .gallery-nav.scrolled {
      background: rgba(8, 8, 14, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom-color: rgba(255,255,255,0.07);
    }

    .gallery-nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #e8e0f0;
      text-decoration: none;
      transition: opacity 0.25s;
    }
    .gallery-nav-logo:hover { opacity: 0.7; }
    .gallery-nav-logo img {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .gallery-nav-logo span {
      font-family: var(--ff-serif);
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .gallery-nav-back {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--ff-sans);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(232,224,240,0.5);
      text-decoration: none;
      transition: color 0.25s;
    }
    .gallery-nav-back:hover { color: var(--clr-gold-light, #d4b483); }
    .gallery-nav-back svg { transition: transform 0.25s; }
    .gallery-nav-back:hover svg { transform: translateX(-3px); }

    /* ── Tiny hero ── */
    .gallery-hero {
      padding: 7rem clamp(1.5rem, 6vw, 5rem) 3rem;
      text-align: center;
    }

    .gallery-hero-title {
      font-family: var(--ff-serif);
      font-size: clamp(2rem, 4.5vw, 3.8rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #f0eaf8;
      opacity: 0;
      animation: fadeUp 0.9s 0.1s cubic-bezier(.16,1,.3,1) forwards;
    }
    .gallery-hero-title em {
      font-style: italic;
      color: var(--clr-gold-light, #d4b483);
    }


    /* ── Pure masonry collage ── */

    .gallery-collage {
      padding: 0 clamp(0.5rem, 2vw, 1.5rem) 5rem;
      max-width: 1500px;
      margin: 0 auto;
    }

    .gallery-grid {
      columns: 8;
      column-gap: 3px;
      opacity: 0;
      animation: fadeUp 1s 0.35s cubic-bezier(.16,1,.3,1) forwards;
    }

    @media (max-width: 1400px) { .gallery-grid { columns: 7; } }
    @media (max-width: 1100px) { .gallery-grid { columns: 6; } }
    @media (max-width: 850px)  { .gallery-grid { columns: 5; } }
    @media (max-width: 650px)  { .gallery-grid { columns: 4; } }
    @media (max-width: 420px)  { .gallery-grid { columns: 3; } }

    /* ── Each photo tile ── */
    .gallery-item {
      break-inside: avoid;
      margin-bottom: 4px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: block;
      background: rgba(255,255,255,0.03);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      object-position: center;
      transition: transform 0.5s cubic-bezier(.16,1,.3,1), filter 0.35s;
      filter: brightness(0.9) saturate(0.85);
    }

    .gallery-item:hover img {
      transform: scale(1.06);
      filter: brightness(1.06) saturate(1.12);
    }

    /* Subtle dark overlay on hover */
    .gallery-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.18);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .gallery-item:hover::after { opacity: 1; }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(4, 4, 8, 0.97);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-img-wrap {
      position: relative;
      max-width: min(92vw, 1100px);
      max-height: 90vh;
      transform: scale(0.93);
      transition: transform 0.4s cubic-bezier(.16,1,.3,1);
    }
    .lightbox.open .lightbox-img-wrap { transform: scale(1); }

    .lightbox-img-wrap img {
      display: block;
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }

    /* Counter badge */
    .lightbox-counter {
      position: absolute;
      bottom: -2.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--ff-sans);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      color: rgba(232,224,240,0.38);
    }

    .lightbox-close {
      position: fixed;
      top: 1.25rem; right: 1.25rem;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(8,8,14,0.8);
      color: rgba(232,224,240,0.7);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .lightbox-close:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

    .lightbox-arrow {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(8,8,14,0.75);
      color: rgba(232,224,240,0.6);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .lightbox-arrow:hover {
      border-color: rgba(255,255,255,0.35);
      background: rgba(20,18,30,0.9);
      color: #fff;
    }
    .lightbox-arrow--prev { left: 1.25rem; }
    .lightbox-arrow--next { right: 1.25rem; }

    /* ── Footer ── */
    .gallery-footer {
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .gallery-footer p {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: rgba(232,224,240,0.2);
      text-transform: uppercase;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <script>
    /* ── Scroll-aware nav ── */
    (function () {
      var nav = document.getElementById('gallery-nav');
      window.addEventListener('scroll', function () {
        nav.classList.toggle('scrolled', window.scrollY > 20);
      }, { passive: true });
    })();

    /* ── Lightbox ── */
    (function () {
      var lightbox = document.getElementById('lightbox');
      var lbImg    = document.getElementById('lightbox-img');
      var lbCount  = document.getElementById('lightbox-counter');
      var lbClose  = document.getElementById('lightbox-close');
      var lbPrev   = document.getElementById('lightbox-prev');
      var lbNext   = document.getElementById('lightbox-next');

      var images  = Array.from(document.querySelectorAll('.gallery-item img'));
      var current = 0;

      function openAt(index) {
        if (!images.length) return;
        current = (index + images.length) % images.length;
        lbImg.src = images[current].src;
        lbImg.alt = images[current].alt;
        lbCount.textContent = (current + 1) + ' / ' + images.length;
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function close() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      }

      document.querySelectorAll('.gallery-item').forEach(function (item, i) {
        item.addEventListener('click', function () { openAt(i); });
      });

      lbClose.addEventListener('click', close);
      lbPrev.addEventListener('click',  function () { openAt(current - 1); });
      lbNext.addEventListener('click',  function () { openAt(current + 1); });

      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) close();
      });

      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape')     close();
        if (e.key === 'ArrowLeft')  openAt(current - 1);
        if (e.key === 'ArrowRight') openAt(current + 1);
      });
    })();
  </script>
