<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merch &mdash; Octaves VNIT Nagpur</title>
  <meta name="description" content="Octaves merchandise — VNIT Nagpur's music club." />
  <link rel="icon" type="image/jpeg" href="/octaves.jpg" />
  <link rel="shortcut icon" type="image/jpeg" href="octaves.jpg" />
  <link rel="apple-touch-icon" href="/octaves.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: #0a0a08;
      min-height: 100vh;
    }

    /* ── Fixed top nav ── */
    .merch-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem clamp(1.25rem, 5vw, 2.5rem);
      background: rgba(10, 10, 8, 0);
      transition: background 0.4s, border-color 0.4s;
      border-bottom: 1px solid transparent;
    }

    .merch-nav.scrolled {
      background: rgba(10, 10, 8, 0.92);
      backdrop-filter: blur(16px);
      border-bottom-color: rgba(255,255,255,0.07);
    }

    .merch-nav-logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #f0ebe0;
      text-decoration: none;
      transition: opacity 0.25s;
    }

    .merch-nav-logo:hover { opacity: 0.7; }

    .merch-nav-logo img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .merch-nav-logo span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.15em;
    }

    /* ── Merch image section ── */
    .merch-body {
      padding-top: 72px; /* below fixed nav */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .merch-image-wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(1.5rem, 4vw, 3rem) clamp(1rem, 5vw, 2rem) clamp(2rem, 5vw, 4rem);
    }

    .merch-image-wrap img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
    }

    /* ── Mobile: full width, no side padding ── */
    @media (max-width: 600px) {
      .merch-image-wrap {
        padding: 1rem 0 2rem;
        max-width: 100%;
      }

      .merch-image-wrap img {
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Fixed nav -->
  <nav class="merch-nav" id="merch-nav" aria-label="Navigation">
    <a href="index.html" class="merch-nav-logo" aria-label="Back to Octaves Home">
      <img src="octaves.jpg" alt="Octaves Logo" />
      <span>OCTAVES</span>
    </a>
    <div class="nav-actions">
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Open navigation" aria-expanded="false">
        <span class="ham-bar"></span>
        <span class="ham-bar"></span>
        <span class="ham-bar"></span>
      </button>
    </div>
  </nav>

  <!-- Slide-in Drawer -->
  <div class="nav-drawer-overlay" id="nav-drawer-overlay" aria-hidden="true"></div>
  <aside class="nav-drawer" id="nav-drawer" aria-label="Site navigation" aria-hidden="true">
    <div class="drawer-header">
      <span class="drawer-brand">OCTAVES</span>
      <button class="drawer-close" id="drawer-close" aria-label="Close navigation">&times;</button>
    </div>
    <nav class="drawer-nav">
      <a href="archives.html" class="drawer-link">Archives</a>
      <a href="roster.html"   class="drawer-link">Members</a>
      <a href="merch.html"    class="drawer-link">Merch</a>
      <a href="gallery.html"  class="drawer-link">Gallery</a>
    </nav>
    <div class="drawer-footer">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeodG04VcIMXu8eJXGvgRpeRrBSjTf3WcK5hB9uNO5Sr9JnNw/viewform?usp=header" target="_blank" rel="noopener noreferrer" class="drawer-register-btn">Register Now &rarr;</a>
    </div>
  </aside>

  <!-- Merch update image -->
  <div class="merch-body">
    <div class="merch-image-wrap">
      <img src="merch_update.jpeg" alt="Octaves Merch Update" />
    </div>
  </div>

  <script>
    /* Scroll-aware nav */
    (function () {
      var nav = document.getElementById('merch-nav');
      window.addEventListener('scroll', function () {
        nav.classList.toggle('scrolled', window.scrollY > 20);
      }, { passive: true });
    })();
  </script>

  <script src="script.js"></script>
</body>
</html>
